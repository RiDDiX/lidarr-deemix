services:
  lidarr-deemix:
    image: ghcr.io/riddix/lidarr-deemix:latest
    # Alternativ: lokal bauen mit
    # build: .
    container_name: lidarr-deemix
    restart: unless-stopped
    # =========================================================
    # SECURITY: Port 8080 is an anonymous forward proxy
    # (mitmproxy). --allow-hosts only limits what gets
    # MITM-intercepted - CONNECT tunnels to arbitrary hosts
    # are passed through. Do NOT expose this port to the
    # internet; if Lidarr runs on the same host, bind to
    # localhost (see below) or use an internal Docker
    # network without publishing the port at all.
    # =========================================================
    ports:
      - "8080:8080"
      # Recommended when Lidarr runs on the same host:
      # - "127.0.0.1:8080:8080"
    environment:
      # ===========================================
      # REQUIRED: Your Deezer ARL token
      # Get it from: deezer.com -> DevTools -> Cookies -> arl
      # ===========================================
      - DEEMIX_ARL=${DEEMIX_ARL}

      # ===========================================
      # OPTIONAL: Feature Flags
      # ===========================================
      # Prioritize Deezer albums over MusicBrainz
      - PRIO_DEEMIX=${PRIO_DEEMIX:-false}

      # Use Deezer data ONLY (ignore MusicBrainz)
      # WARNING: This will remove MB-imported artists!
      - OVERRIDE_MB=${OVERRIDE_MB:-false}

      # Prefer Deluxe/Extended editions over standard albums
      - PREFER_SPECIAL_EDITIONS=${PREFER_SPECIAL_EDITIONS:-false}

      # ===========================================
      # OPTIONAL: Lidarr Connection (for OVERRIDE_MB)
      # ===========================================
      - LIDARR_URL=${LIDARR_URL:-}
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}

      # ===========================================
      # OPTIONAL: Logging
      # ===========================================
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # ===========================================
      # OPTIONAL: Tuning / proxy hardening
      # ===========================================
      # Cap for Deezer album search results per artist refresh
      - DEEMIX_MAX_ALBUMS=${DEEMIX_MAX_ALBUMS:-500}
      # Extra mitmdump arguments, e.g. --proxyauth user:pass
      - MITM_EXTRA_ARGS=${MITM_EXTRA_ARGS:-}

    volumes:
      - ./config:/app/config
      - ./logs:/app/logs

    healthcheck:
      # 7171 is the internal API server; 8080 is the mitmproxy port
      # and does not answer direct HTTP requests
      test: ["CMD-SHELL", "curl -sf http://localhost:$${PROXY_PORT:-7171}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

